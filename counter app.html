<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            padding-top: 100px;
        }

        h1 {
            color: #333;
        }

        #count {
            font-size: 60px;
            margin: 30px;
            color: #0077b6;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #0077b6;
            color: white;
        }

        button:hover {
            background-color: #023e8a;
        }
    </style>
</head>

<body>

    <h1>Counter App</h1>

    <div id="count">0</div>

    <button onclick="decrease()">−</button>
    <button onclick="reset()">Reset</button>
    <button onclick="increase()">+</button>

    <script>
        let count = 0;

        function increase() {
            count++;
            document.getElementById("count").innerText = count;
        }

        function decrease() {
            count--;
            document.getElementById("count").innerText = count;
        }

        function reset() {
            count = 0;
            document.getElementById("count").innerText = count;
        }
    </script>

</body>

</html>
