<!DOCTYPE html>
<html>
<head>
    <title>Birthday Countdown</title>
<style>
        body {font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff6a88, #ff99ac, #fad0c4);
            text-align: center;
            padding: 40px;
            color: #333;}
h1 {color: white;
text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);}
.container {background: white;
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            margin: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: 0.3s;}
.container:hover {transform: scale(1.03);}
input {width: 85%;
            padding: 12px;
            margin: 10px;
            border-radius: 10px;
            border: none;
            background: #f1f1f1;
            outline: none;
            font-size: 14px;}
input:focus { background: #ffe6ec;}
button {background: linear-gradient(to right, #ff4081, #ff6a88);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: 0.3s;}
button:hover {transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);}
#result {margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ff4081;}
#review {margin-top: 15px;
            font-size: 14px;
            color: #555;}
    </style>
</head>
<body>
<h1>Birthday Countdown Checker</h1>
<div class="container">
        <input type="text" id="name" placeholder="Enter your name">
        <input type="date" id="birthday">
<br>
        <button onclick="checkBirthday()">Check Now</button>
<div id="result"></div>
        <div id="review"></div>
    </div>
<script>
        function checkBirthday() {
            let name = document.getElementById("name").value;
            let bdayInput = document.getElementById("birthday").value;
 if (name === "" || bdayInput === "") {
                alert("Please fill all fields");
                return;}
let today = new Date();
let birthday = new Date(bdayInput);
 birthday.setFullYear(today.getFullYear());
if (birthday < today) {
                birthday.setFullYear(today.getFullYear() + 1);}
 let diff = birthday - today;
let daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));
let message = "";
let review = "";
if (daysLeft === 0) {message = "Happy Birthday " + name.toUpperCase(); } else if (daysLeft === 1) {
                message = name + ", your birthday is tomorrow";
            } else if (daysLeft <= 7) {message = "Only " + daysLeft + " days left, " + name;} else {
                message = name + ", " + daysLeft + " days remaining";}
for (let i = 3; i >= 1; i--) {
                review += "Countdown " + i + ": " + daysLeft + " days left<br>";}
document.getElementById("result").innerHTML = message;
document.getElementById("review").innerHTML = review;}
    </script>
    </body>
</html>
