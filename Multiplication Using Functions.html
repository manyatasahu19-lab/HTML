<!DOCTYPE html>
<html>

<head>
    <title>Multiplication using Functions</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f4f4;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 100px auto;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            margin: 10px;
            padding: 8px;
            width: 80%;
        }

        button {
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Multiplication Project</h2>
        <input type="number" id="num1" placeholder="Enter first number"><br>
        <input type="number" id="num2" placeholder="Enter second number"><br>
        <button onclick="calculate()">Multiply</button>
        <h3 id="result"></h3>
    </div>

    <script>
        function multiply(a, b) {
            return a * b;
        }

        function calculate() {
            let n1 = document.getElementById("num1").value;
            let n2 = document.getElementById("num2").value;

            let result = multiply(n1, n2);
            document.getElementById("result").innerText = "Result: " + result;
        }
    </script>

</body>

</html>
