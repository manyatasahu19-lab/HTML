<html>
    <head>
        <title>Lists</title>
    </head>
    <body>
        <h2>An ordered Html list:</h2>
        <ol>
            <li>first item</li>
            <li>second item</li>
            <li>third item</li>
            </ol>
            <h2>An unordered list</h2>
            <ul>
                <li>first</li>
                <li>second</li>
                <li>third</li>
                </ul>
                </body>
                </html>
